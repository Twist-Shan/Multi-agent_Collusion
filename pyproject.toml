[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-collusion"
version = "0.1.0"
description = "Controlled experiments on unauthorized joint disclosure by LLM agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
collusion = "collusion.cli:main"

[tool.setuptools.packages.find]
include = ["collusion*"]
